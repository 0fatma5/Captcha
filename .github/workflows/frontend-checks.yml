name: Frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Verify static image assets
        run: |
          for f in img{1..6}.jpeg rimg{1..6}.jpeg; do
            test -f "$f" || exit 1
          done
